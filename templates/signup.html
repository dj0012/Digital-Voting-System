<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Voting Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ecf0f1;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-back {
            background: #ecf0f1;
            color: #2c3e50;
        }
        
        .btn-back:hover {
            background: #bdc3c7;
        }
        
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Voter Registration</h1>
            <p>Create your account to vote</p>
        </div>
        
        <form id="signupForm">
            <div class="form-row">
                <div class="form-group">
                    <label>Aadhaar Number (12 digits)</label>
                    <input type="text" id="aadhaar" placeholder="XXXXXXXXXXXX" required>
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select id="gender" required>
                        <option value="">Select Gender</option>
                        <option value="M">Male</option>
                        <option value="F">Female</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="fname" placeholder="First Name" required>
                </div>
                <div class="form-group">
                    <label>Middle Name</label>
                    <input type="text" id="mname" placeholder="Middle Name" required>
                </div>
            </div>
            
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" id="lname" placeholder="Last Name" required>
            </div>
            
            <div class="form-group">
                <label>Date of Birth (YYYY-MM-DD)</label>
                <input type="date" id="dob" required>
            </div>
            
            <div class="form-group">
                <label>Phone Number (10 digits)</label>
                <input type="text" id="phone" placeholder="9999999999" maxlength="10" required>
            </div>
            
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="email@example.com" required>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Locality</label>
                    <input type="text" id="locality" placeholder="Locality" required>
                </div>
                <div class="form-group">
                    <label>City</label>
                    <input type="text" id="city" placeholder="City" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>State</label>
                    <input type="text" id="state" placeholder="State" required>
                </div>
                <div class="form-group">
                    <label>Zip Code</label>
                    <input type="text" id="zip" placeholder="Zip Code" required>
                </div>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirm_pass" placeholder="Confirm password" required>
            </div>
            
            <div class="loading" id="loading">
                <p>Creating your account...</p>
            </div>
            
            <div class="message" id="message"></div>
            
            <div class="button-group">
                <button type="submit" class="btn-submit">Register</button>
                <a href="/menu" class="btn-back" style="text-decoration: none; display: flex; align-items: center; justify-content: center;">Back</a>
            </div>
        </form>
    </div>
    
    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const messageDiv = document.getElementById('message');
            const loading = document.getElementById('loading');
            
            messageDiv.style.display = 'none';
            loading.style.display = 'block';
            
            const data = {
                aadhaar: document.getElementById('aadhaar').value,
                fname: document.getElementById('fname').value,
                mname: document.getElementById('mname').value,
                lname: document.getElementById('lname').value,
                gender: document.getElementById('gender').value,
                dob: document.getElementById('dob').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                locality: document.getElementById('locality').value,
                city: document.getElementById('city').value,
                state: document.getElementById('state').value,
                password: document.getElementById('password').value,
                confirm_pass: document.getElementById('confirm_pass').value
            };
            
            try {
                const response = await fetch('/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                loading.style.display = 'none';
                messageDiv.style.display = 'block';
                
                if (result.success) {
                    messageDiv.className = 'message success';
                    messageDiv.textContent = result.message;
                    setTimeout(() => window.location.href = '/menu', 2000);
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = result.message;
                }
            } catch (error) {
                loading.style.display = 'none';
                messageDiv.style.display = 'block';
                messageDiv.className = 'message error';
                messageDiv.textContent = 'Registration failed: ' + error.message;
            }
        });
    </script>
</body>
</html>
